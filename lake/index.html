<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artificial lake &middot; water surface</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070a;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Shown only if WebGL2 or the shaders fail, so a blank page is never silent. */
  #error {
    position: fixed;
    inset: auto 0 0 0;
    padding: 12px 16px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ffd9d9;
    background: #2a0d0d;
    white-space: pre-wrap;
    display: none;
  }
  body[data-error] #error { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="lake"></canvas></div>
<pre id="error"></pre>

<script src="src/shaders.js"></script>
<script src="src/lake.js"></script>
<script>
  (function () {
    var canvas = document.getElementById("lake");
    try {
      var api = window.LAKE.mount(canvas);
      window.LAKEAPI = api;
      window.LAKE.ready = true;
      window.LAKE.info = { renderer: api.renderer, duration: api.duration, fps: api.fps };
      /* The capture script sets __LAKE_OFFLINE__ and drives frames itself. */
      if (!window.__LAKE_OFFLINE__) {
        api.start();
      }
    } catch (err) {
      document.body.dataset.error = err.message;
      document.getElementById("error").textContent = err.message;
      throw err;
    }
  })();
</script>
</body>
</html>
